<!doctype html>
<!--
  PROTOTYPE, throwaway (KAN-41). Eight candidate KPI templates, one per ?variant=<slug>, switched
  from the bar at the bottom or with the arrow keys. ?variant=overview shows every candidate at
  both sizes. Each candidate renders at Report Hacker's KPI band size (300 x 90), in a grid cell
  (400 x 220) and in a box you can drag to any size, with the BI Nexus theme or Power BI's default.
  Never ship this page: it lives on the prototype branch only.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>KPI template prototypes</title>
<script src="../../tools/node_modules/vega/build/vega.min.js"></script>
<script src="../../tools/node_modules/vega-lite/build/vega-lite.min.js"></script>
<style>
  :root { --ink: #252423; --muted: #605E5C; --line: #E1DFDD; --page: #F3F2F1; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; color: var(--ink); background: var(--page); padding-bottom: 96px; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 18px 32px 16px; }
  .proto { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #8A3A00; background: #FFF4CE; border-radius: 3px; padding: 2px 6px; margin-right: 10px; vertical-align: middle; }
  h1 { font-size: 22px; margin: 6px 0 4px; font-weight: 600; }
  header p { margin: 4px 0; max-width: 980px; color: var(--muted); font-size: 14px; line-height: 1.45; }
  .note { color: #3B3A39; }
  .controls { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .controls button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  .controls button[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
  main { padding: 8px 32px; }
  section { margin: 22px 0 8px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: var(--muted); margin-top: 6px; max-width: 400px; }
  .chart { position: relative; }
  .resizer { resize: both; overflow: hidden; width: 520px; height: 260px; min-width: 120px; min-height: 60px; border: 1px dashed #A19F9D; background: transparent; }
  .size { font-size: 12px; color: var(--muted); margin-top: 6px; }
  table { border-collapse: collapse; font-size: 12.5px; background: #fff; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 10px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td code { font-family: Consolas, monospace; font-size: 12px; }
  .state { display: grid; grid-template-columns: minmax(420px, 1.2fr) minmax(320px, 1fr); gap: 24px; }
  .logs { font-family: Consolas, monospace; font-size: 12px; color: #A4262C; white-space: pre-wrap; }
  .overview-item { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px 16px; margin-bottom: 18px; }
  .overview-item h3 { margin: 0 0 10px; font-size: 16px; font-weight: 600; }
  .overview-item h3 a { color: inherit; }
  .overview-item .row { gap: 12px; }
  #switcher { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: #11100F; color: #fff; border-radius: 999px; padding: 6px; box-shadow: 0 6px 24px rgba(0,0,0,.28); font-size: 14px; z-index: 10; }
  #switcher button { font: inherit; font-size: 16px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: #3B3A39; color: #fff; cursor: pointer; }
  #switcher button:hover { background: #605E5C; }
  #switcher .label { min-width: 280px; text-align: center; padding: 0 10px; white-space: nowrap; }
  #switcher .label b { font-weight: 600; }
  #tip { position: fixed; pointer-events: none; background: #fff; border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,.15); font-size: 12px; padding: 6px 8px; display: none; z-index: 20; }
  #tip td { border: 0; padding: 1px 6px 1px 0; }
</style>
</head>
<body>
<header id="head"></header>
<main id="main"></main>
<div id="switcher" role="navigation" aria-label="Prototype variants">
  <button id="prev" title="Previous (left arrow)">&#9664;</button>
  <span class="label" id="label"></span>
  <button id="next" title="Next (right arrow)">&#9654;</button>
</div>
<div id="tip"></div>
<script type="module">
import { denebRows, registerDeneb, resolveTemplate, toVega, POWER_BI_DEFAULT } from './prepare.mjs'

const manifest = await (await fetch('manifest.json')).json()
const templates = Object.fromEntries(await Promise.all(manifest.map(async (t) => [t.slug, await (await fetch(t.file)).json()])))
const biNexus = await (await fetch('../../showcase/theme/bi-nexus.json')).json()
const THEMES = { 'bi-nexus': biNexus, 'power-bi': POWER_BI_DEFAULT }
const KEYS = ['overview', ...manifest.map((t) => t.slug)]
const BAND = { width: 300, height: 90 }
const CELL = { width: 400, height: 220 }

const params = new URLSearchParams(location.search)
let current = KEYS.includes(params.get('variant')) ? params.get('variant') : manifest[0].slug
let themeKey = THEMES[params.get('theme')] ? params.get('theme') : 'bi-nexus'
let views = []
let resizeObserver = null

const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) k === 'text' ? (node.textContent = v) : node.setAttribute(k, v)
  for (const kid of kids) node.append(kid)
  return node
}

// ------------------------------------------------------------ tooltip, like Deneb's: field and value
const tipBox = document.getElementById('tip')
function tooltip(handler, event, item, value) {
  if (value == null || value === '') { tipBox.style.display = 'none'; return }
  const rows = typeof value === 'object' ? Object.entries(value) : [['', value]]
  tipBox.replaceChildren(el('table', {}, ...rows.map(([k, v]) => el('tr', {}, el('td', { text: k }), el('td', { text: String(v) })))))
  tipBox.style.display = 'block'
  tipBox.style.left = event.clientX + 14 + 'px'
  tipBox.style.top = event.clientY + 14 + 'px'
}

// ------------------------------------------------------------ one render
async function draw(host, slug, entry, rows, size, opts = {}) {
  const template = templates[slug]
  const box = el('div', { class: 'chart' })
  box.style.width = size.width + 'px'
  box.style.height = size.height + 'px'
  host.replaceChildren(box)
  const { vg, logs } = toVega(vegaLite, resolveTemplate(template, entry?.params ?? {}), size.width, size.height)
  const view = new vega.View(vega.parse(vg), { renderer: 'svg', container: box, hover: true })
  view.tooltip(tooltip)
  const vlogs = []
  view.logger({ level() { return this }, error: (...m) => vlogs.push('error: ' + m.join(' ')), warn: (...m) => vlogs.push('warn: ' + m.join(' ')), info() {}, debug() {} })
  view.data('dataset', denebRows(rows ?? [], template.usermeta.dataset, opts))
  await view.runAsync()
  views.push(view)
  return [...logs, ...vlogs]
}

function figure(caption) {
  const host = el('div')
  return { node: el('figure', {}, host, el('figcaption', { text: caption })), host }
}

// ------------------------------------------------------------ pages
function themeControls() {
  const wrap = el('div', { class: 'controls' }, el('span', { text: 'Theme:' }))
  for (const [key, label] of [['bi-nexus', 'BI Nexus'], ['power-bi', 'Power BI default']]) {
    const b = el('button', { 'aria-pressed': String(themeKey === key), text: label })
    b.onclick = () => { themeKey = key; params.set('theme', key); history.replaceState(null, '', '?' + params); show() }
    wrap.append(b)
  }
  wrap.append(el('span', { text: 'Left and right arrow keys switch templates. Hover a mark for its tooltip.' }))
  return wrap
}

async function showTemplate(t) {
  const head = document.getElementById('head')
  head.replaceChildren(
    el('div', {}, el('span', { class: 'proto', text: 'PROTOTYPE' }), el('span', { text: `KPI templates for KAN-41: candidate ${manifest.indexOf(t) + 1} of ${manifest.length}` })),
    el('h1', { text: t.name }),
    el('p', { text: t.description }),
    el('p', { class: 'note', text: t.note }),
    el('p', { text: 'Fields: ' + t.fields.map((f) => `${f.name} (${f.kind}, ${f.type})`).join(', ') }),
    themeControls(),
  )
  const main = document.getElementById('main')
  main.replaceChildren()
  const logs = []

  const band = el('section', {}, el('h2', { text: "KPI band: four across at 300 x 90, Report Hacker's default" }))
  const bandRow = el('div', { class: 'row' })
  band.append(bandRow)
  main.append(band)
  for (const b of t.band) {
    const f = figure(b.label + (Object.keys(b.params).length ? '  ' + JSON.stringify(b.params) : ''))
    bandRow.append(f.node)
    logs.push(...await draw(f.host, t.slug, b, b.rows, BAND))
  }

  const grid = el('section', {}, el('h2', { text: 'Grid cell: 400 x 220' }))
  const gridRow = el('div', { class: 'row' })
  grid.append(gridRow)
  main.append(grid)
  const cells = [
    ['Template sample (sample-data.csv, default settings)', { params: {} }, t.sample, {}],
    [`Option: ${t.alt.label}  ${JSON.stringify(t.alt.params)}`, t.alt, t.alt.rows, {}],
  ]
  if (t.rh) cells.push(["Report Hacker's sample, bound the way its preview binds it", { params: {} }, t.rh, { keepStrings: true }])
  for (const [caption, entry, rows, opts] of cells) {
    const f = figure(caption)
    gridRow.append(f.node)
    logs.push(...await draw(f.host, t.slug, entry, rows, CELL, opts))
  }
  if (t.rh) {
    const f = figure("Report Hacker's sample in a band tile")
    gridRow.append(f.node)
    logs.push(...await draw(f.host, t.slug, { params: {} }, t.rh, BAND, { keepStrings: true }))
  }

  const free = el('section', {}, el('h2', { text: 'Any size: drag the corner' }))
  const resizer = el('div', { class: 'resizer' })
  const sizeLabel = el('div', { class: 'size' })
  free.append(resizer, sizeLabel)
  main.append(free)
  let pending = 0
  resizeObserver = new ResizeObserver(() => {
    clearTimeout(pending)
    pending = setTimeout(async () => {
      const size = { width: Math.round(resizer.clientWidth), height: Math.round(resizer.clientHeight) }
      sizeLabel.textContent = `${size.width} x ${size.height}, template sample`
      const old = views.findIndex((v) => v.container()?.parentElement === resizer)
      if (old >= 0) views.splice(old, 1)[0].finalize()
      await draw(resizer, t.slug, { params: {} }, t.sample, size)
    }, 60)
  })
  resizeObserver.observe(resizer)

  const state = el('section', {}, el('h2', { text: 'State: settings and sample rows' }))
  const paramsTable = el('table', {}, el('tr', {}, el('th', { text: 'Setting' }), el('th', { text: 'Default' }), el('th', { text: 'What it does' })))
  for (const p of t.params.filter((p) => p.doc)) {
    const value = p.expr !== undefined ? p.expr : JSON.stringify(p.value)
    paramsTable.append(el('tr', {}, el('td', {}, el('code', { text: p.name })), el('td', {}, el('code', { text: value })), el('td', { text: p.doc })))
  }
  const names = t.fields.map((f) => f.name)
  const rowsTable = el('table', {}, el('tr', {}, ...names.map((n) => el('th', { text: n }))))
  for (const r of t.sample.slice(0, 16)) rowsTable.append(el('tr', {}, ...names.map((n) => el('td', { text: r[n] ?? '' }))))
  if (t.sample.length > 16) rowsTable.append(el('tr', {}, el('td', { colspan: names.length, text: `... ${t.sample.length - 16} more rows` })))
  state.append(el('div', { class: 'state' }, paramsTable, el('div', {}, rowsTable, el('div', { class: 'logs', text: [...new Set(logs)].join('\n') }))))
  main.append(state)
}

async function showOverview() {
  const head = document.getElementById('head')
  head.replaceChildren(
    el('div', {}, el('span', { class: 'proto', text: 'PROTOTYPE' }), el('span', { text: 'KPI templates for KAN-41' })),
    el('h1', { text: 'All eight candidates' }),
    el('p', { text: 'Each at the KPI band size (300 x 90) and in a grid cell (400 x 220), with its own sample data. Click a name, or use the arrows, to see one candidate in full.' }),
    themeControls(),
  )
  const main = document.getElementById('main')
  main.replaceChildren()
  for (const [i, t] of manifest.entries()) {
    const link = el('a', { href: `?variant=${t.slug}&theme=${themeKey}`, text: `${i + 1}. ${t.name}` })
    const row = el('div', { class: 'row' })
    main.append(el('div', { class: 'overview-item' }, el('h3', {}, link), row))
    for (const b of t.band.slice(0, 2)) {
      const f = figure(b.label)
      row.append(f.node)
      await draw(f.host, t.slug, b, b.rows, BAND)
    }
    const f = figure('Template sample, 400 x 220')
    row.append(f.node)
    await draw(f.host, t.slug, { params: {} }, t.sample, CELL)
  }
}

// ------------------------------------------------------------ switching
async function show() {
  for (const v of views) v.finalize()
  views = []
  resizeObserver?.disconnect()
  registerDeneb(vega, THEMES[themeKey])
  const i = KEYS.indexOf(current)
  const name = current === 'overview' ? 'Overview' : manifest.find((t) => t.slug === current).name
  document.getElementById('label').replaceChildren(el('span', { text: `${i + 1} / ${KEYS.length}  ` }), el('b', { text: name }))
  document.title = `${name}: KPI template prototypes`
  if (current === 'overview') await showOverview()
  else await showTemplate(manifest.find((t) => t.slug === current))
}

function go(step) {
  current = KEYS[(KEYS.indexOf(current) + step + KEYS.length) % KEYS.length]
  params.set('variant', current)
  history.replaceState(null, '', '?' + params)
  window.scrollTo(0, 0)
  show()
}
document.getElementById('prev').onclick = () => go(-1)
document.getElementById('next').onclick = () => go(1)
document.addEventListener('keydown', (e) => {
  const t = e.target
  if (t.closest?.('input, textarea, [contenteditable=""], [contenteditable="true"]')) return
  if (e.key === 'ArrowLeft') go(-1)
  if (e.key === 'ArrowRight') go(1)
})
params.set('variant', current)
history.replaceState(null, '', '?' + params)
show()
</script>
</body>
</html>
